version: 1.0.0
# Devices Configuration for ESP32-P4 WIFI6 Touch LCD 4.3"
devices:
  - name: audio_dac
    chip: es8311  # Codec chip (ES8311)
    type: audio_codec
    version: default
    config:
      # DAC Configuration (for audio output)
      dac_enabled: true
      dac_max_channel: 1     # ES8311 support 1 DAC channel (default right channel, REG:0x09 - SDP_IN_SEL)
      dac_channel_mask: "1"  # Enable left channel
      mclk_enabled: true     # MCLK pin (GPIO13) is wired to ES8311; tell driver to use external MCLK

    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1

      # I2S interface for audio output
      - name: i2s_audio_out

      # I2C interface for codec control
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: audio_adc
    chip: es7210  # Codec chip (ES7210) - dedicated ADC for microphone input
    type: audio_codec
    version: default
    config:
      # ADC Configuration (for audio input)
      adc_enabled: true
      adc_max_channel: 4
      # The channel mask, 1-enable, 0-disable
      # e.g."0001", bit0: Mic0 enable, bit1: Mic1 enable, bit2: Mic2 enable, bit3: Mic3 enable
      # Using single MIC1 (standard I2S) to match reference project. TDM mode with
      # 3+ mics requires specific I2S TDM configuration that the current I2S stereo
      # setup doesn't support.
      adc_channel_mask: "0001"         # Mic0 only (MIC1, standard I2S mode)
      adc_channel_labels: ['NA', 'NA', 'NA', 'FL']  # MSB ~ LSB
      adc_init_gain: 18                 # dB (matching reference project)

    # Peripheral configuration
    peripherals:
      # I2S interface for audio input
      - name: i2s_audio_in

      # I2C interface for codec control
      - name: i2c_master
        address: 0x80
        frequency: 400000

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      sub_config:
        # Use SDMMC slot 0
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        # If using slot 0, the pin must be configured as 0, the IO pins actually used are configured by the SDMMC driver
        pins:
          clk: 0
          cmd: 0
          d0: 0
          d1: 0
          d2: 0
          d3: 0
          d4: 0
          d5: 0
          d6: 0
          d7: 0
        ldo_chan_id: 4  # Use LDO_VO4 to power SDMMC IO

  # DSI Display Device - 4.3" 480x800
  - name: display_lcd
    chip: st7701
    type: display_lcd
    sub_type: dsi
    dependencies:
      espressif/esp_lcd_st7701: ">=1.0.0"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      bits_per_pixel: 16
      reset_active_high: 0
      need_reset: true
      mirror_x: false
      mirror_y: false
      swap_xy: false
      invert_color: false
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 30
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 2
        flags:
          use_dma2d: true
          disable_lp: false
        video_timing:
          h_size: 480
          v_size: 800
          hsync_back_porch : 42
          hsync_pulse_width : 12
          hsync_front_porch : 42
          vsync_back_porch : 2
          vsync_pulse_width : 8
          vsync_front_porch : 60
      peripherals:
      - name: ldo_mipi
      - name: dsi_display

  # Touch Panel Configuration - GT911
  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16        # Bit-width of LCD command
      touch_config:
        x_max: 480  # Maximum X coordinate (480x800 4.3" LCD)
        y_max: 800  # Maximum Y coordinate
        flags:
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0xBA, 0x28]  # GT911 I2C addresses (8-bit left-shifted)

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight
